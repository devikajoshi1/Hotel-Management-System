# Settings used on the live server (activated with SPRING_PROFILES_ACTIVE=prod).
# Every ${...} value is read from the hosting site's Environment Variables,
# so no password is ever stored in this file.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.web.error.include-message=always

# The hosting site tells the app which port to use
server.port=${PORT:8080}

# The live frontend address, e.g. https://luxora.vercel.app
app.cors.allowed-origins=${FRONTEND_URL}
